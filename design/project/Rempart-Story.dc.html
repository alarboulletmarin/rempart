<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #D9CBB0; font-family: Outfit, Helvetica, sans-serif; }
  a { color: #A8481F; text-decoration: underline; text-underline-offset: 3px; }
  a:hover { color: #2E2418; }
</style>
</helmet>

<div style="width:1080px; height:1920px; background:#E4D7BE; display:flex; flex-direction:column; padding:250px 90px 230px; gap:0; overflow:hidden">

  <div style="display:flex; align-items:center; gap:18px">
    <div style="width:30px; height:30px; border-radius:8px; background:#C0562F; box-shadow:inset 0 -8px 0 #8E3A1C"></div>
    <div style="font:600 30px/1 Outfit, sans-serif; letter-spacing:0.18em; color:#7A6B55; text-transform:uppercase">Bientôt · jeu de bluff à 4</div>
  </div>

  <div style="font:700 210px/0.86 'Bricolage Grotesque', Helvetica, sans-serif; color:#2E2418; letter-spacing:-0.03em; margin-top:34px">Rempart</div>

  <div style="font:500 52px/1.22 Outfit, sans-serif; color:#5F5342; margin-top:34px; max-width:840px; text-wrap:pretty">Quatre cartes. Dix manches.<br><span style="color:#A8481F; font-weight:600">Un seul mur encore debout.</span></div>

  <div style="margin-top:76px; display:flex; flex-direction:column; gap:16px">
    <div style="display:flex; gap:16px; height:132px">
      <div style="flex:1; border-radius:20px; background:#C0562F; box-shadow:inset 0 -20px 0 #8E3A1C"></div>
      <div style="flex:1; border-radius:20px; background:#C0562F; box-shadow:inset 0 -20px 0 #8E3A1C"></div>
      <div style="flex:1; border-radius:20px; background:#EFE2C8; box-shadow:inset 0 -20px 0 #DCC9A6; display:flex; align-items:center; justify-content:center">
        <div style="width:74px; height:12px; border-radius:6px; background:#C6AF88; transform:rotate(-24deg)"></div>
      </div>
      <div style="flex:1; border-radius:20px; background:#C0562F; box-shadow:inset 0 -20px 0 #8E3A1C"></div>
      <div style="flex:1; border-radius:20px; background:#C0562F; box-shadow:inset 0 -20px 0 #8E3A1C"></div>
    </div>
    <sc-if value="{{ denseWall }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex; gap:16px; height:132px">
        <div style="flex:1; border-radius:20px; background:#C0562F; box-shadow:inset 0 -20px 0 #8E3A1C"></div>
        <div style="flex:1; border-radius:20px; background:#EFE2C8; box-shadow:inset 0 -20px 0 #DCC9A6; display:flex; align-items:center; justify-content:center">
          <div style="width:74px; height:12px; border-radius:6px; background:#C6AF88; transform:rotate(-24deg)"></div>
        </div>
        <div style="flex:1; border-radius:20px; background:#C0562F; box-shadow:inset 0 -20px 0 #8E3A1C"></div>
        <div style="flex:1; border-radius:20px; background:#C0562F; box-shadow:inset 0 -20px 0 #8E3A1C"></div>
        <div style="flex:1; border-radius:20px; background:#C0562F; box-shadow:inset 0 -20px 0 #8E3A1C"></div>
      </div>
    </sc-if>
  </div>

  <sc-if value="{{ showPictos }}" hint-placeholder-val="{{ true }}">
    <div style="margin-top:76px; display:flex; gap:20px">
      <sc-for list="{{ deck }}" as="c" hint-placeholder-count="4">
        <div style="flex:1; background:#FCF7EC; border-radius:32px; box-shadow:0 10px 0 #C6B08A; padding:30px 16px 26px; display:flex; flex-direction:column; align-items:center; gap:18px">
          {{ c.picto }}
          <div style="font:700 34px/1 'Bricolage Grotesque', Helvetica, sans-serif; color:#2E2418">{{ c.label }}</div>
        </div>
      </sc-for>
    </div>
  </sc-if>

  <div style="margin-top:auto; display:flex; flex-direction:column; gap:22px">
    <div style="font:600 38px/1.25 Outfit, sans-serif; color:#2E2418; text-wrap:pretty">La carte que tu joues est interdite au tour suivant. C’est là que tout se lit sur les visages.</div>
    <div style="display:flex; gap:14px; flex-wrap:wrap">
      <div style="background:#FCF7EC; border-radius:999px; box-shadow:0 6px 0 #C6B08A; padding:18px 30px; font:600 28px/1 Outfit, sans-serif; color:#5F5342">2–4 joueurs</div>
      <div style="background:#FCF7EC; border-radius:999px; box-shadow:0 6px 0 #C6B08A; padding:18px 30px; font:600 28px/1 Outfit, sans-serif; color:#5F5342">4 minutes</div>
      <div style="background:#FCF7EC; border-radius:999px; box-shadow:0 6px 0 #C6B08A; padding:18px 30px; font:600 28px/1 Outfit, sans-serif; color:#5F5342">hors ligne</div>
      <div style="background:#2E2418; border-radius:999px; box-shadow:0 6px 0 #170F06; padding:18px 30px; font:600 28px/1 Outfit, sans-serif; color:#FCF7EC">sans compte</div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1080,&quot;height&quot;:1920},&quot;showPictos&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Contenu&quot;},&quot;denseWall&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Contenu&quot;}}">
class Component extends DCLogic {
  pic(k, s, c) {
    const E = React.createElement;
    const w = Math.max(1.5, s * 0.085);
    const line = { stroke: c, strokeWidth: w, fill: 'none', strokeLinecap: 'round', strokeLinejoin: 'round' };
    const brick = (x, y, solid) => solid
      ? E('rect', { key: 'b' + x + y, x, y, width: 10, height: 5, rx: 1.6, fill: c })
      : E('rect', { key: 'h' + x + y, x: x + w / 2, y: y + w / 2, width: 10 - w, height: 5 - w, rx: 1.4, stroke: c, strokeWidth: w, fill: 'none', opacity: 0.55 });
    const kids = [];
    if (k === 'frapper') {
      kids.push(brick(1.5, 12, true), brick(12.5, 12, false), brick(1.5, 18.5, true), brick(12.5, 18.5, true));
      kids.push(E('path', { key: 'c', d: 'M13.5 3.5 L17.5 8.5 L21.5 3.5', ...line }));
      kids.push(E('path', { key: 'd', d: 'M6 14.5 L9.5 16.5', ...line, opacity: 0.55 }));
    } else if (k === 'bloquer') {
      kids.push(brick(1.5, 12, true), brick(12.5, 12, true), brick(1.5, 18.5, true), brick(12.5, 18.5, true));
      kids.push(E('rect', { key: 'p', x: 0.5, y: 6.5, width: 23, height: 3.6, rx: 1.6, fill: c }));
      kids.push(E('path', { key: 'l', d: 'M4 10.5 L4 12', ...line }), E('path', { key: 'r', d: 'M20 10.5 L20 12', ...line }));
    } else if (k === 'reparer') {
      kids.push(brick(1.5, 12, true), brick(12.5, 12, false), brick(1.5, 18.5, true), brick(12.5, 18.5, true));
      kids.push(E('rect', { key: 'n', x: 12.5, y: 1.5, width: 10, height: 5, rx: 1.6, fill: c }));
      kids.push(E('path', { key: 'a', d: 'M17.5 8 L17.5 10.5', ...line }));
      kids.push(E('path', { key: 'h', d: 'M15.6 8.9 L17.5 10.9 L19.4 8.9', ...line }));
    } else {
      kids.push(brick(1.5, 12, true), brick(12.5, 12, true), brick(1.5, 18.5, true), brick(12.5, 18.5, true));
      kids.push(E('path', { key: 'v', d: 'M3.5 9 L11.5 2.5 L19.5 9', ...line }));
      kids.push(E('path', { key: 'h', d: 'M16.6 8.4 L19.8 9.2 L19.2 6', ...line }));
    }
    return E('svg', { width: s, height: s, viewBox: '0 0 24 24', style: { display: 'block', flex: '0 0 auto' } }, kids);
  }

  renderVals() {
    const labels = { frapper: 'Frapper', bloquer: 'Bloquer', reparer: 'Réparer', pieger: 'Piéger' };
    return {
      showPictos: this.props.showPictos ?? true,
      denseWall: this.props.denseWall ?? true,
      deck: ['frapper', 'bloquer', 'reparer', 'pieger'].map((k) => ({
        label: labels[k], picto: this.pic(k, 104, '#2E2418')
      }))
    };
  }
}

</script>
</body>
</html>

<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#E4D7BE" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#221A12" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Rempart — chacun choisit en secret une carte parmi quatre. La carte jouée est interdite la manche suivante." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Rempart" />
    <!--
      La marque : cinq briques, la troisième manquante. Elle se fabrique par
      `npm run icons` depuis `scripts/icone.py` — le dessin y est décrit une
      fois, le SVG et les PNG en sortent ensemble.

      Le SVG d'abord : c'est lui qui reste net quand l'onglet est affiché sur un
      écran dense. Le PNG de 32 px derrière, pour les navigateurs qui ignorent
      encore les favicones vectorielles ; sans lui ils iraient chercher un
      `/favicon.ico` qui n'existe pas et n'afficheraient rien.

      `apple-touch-icon` enfin, et ce n'est pas un doublon des icônes du
      manifeste : au moment d'ajouter à l'écran d'accueil, iOS va chercher ce
      lien-là. Sans lui, l'app installée n'a pas de logo — le système met à la
      place une capture de la page.
    -->
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icon-32.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Rempart</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
